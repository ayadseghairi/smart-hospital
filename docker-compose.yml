version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: delin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delinpass}
      POSTGRES_DB: ${POSTGRES_DB:-delin_smart_care}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: delin_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI — open http://localhost:8025 to read emails
      - "1025:1025"   # SMTP sink
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ALLOW_INSECURE: true

volumes:
  postgres_data:
