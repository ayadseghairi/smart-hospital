name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - "scripts/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    name: Lint · Build · Audit · Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for gitleaks full history scan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check no fake data
        run: npm run check:no-fake-data

      - name: Audit prod dependencies (BLOCKING — high+critical only)
        # --omit=dev excludes dev-only vulns (vitest, vite, esbuild etc.)
        # react-router/react-router-dom: 2 moderate vulns remain (fix requires v8 — major breaking change).
        # They are below --audit-level=high so this step passes.
        run: npm audit --omit=dev --audit-level=high

      - name: Gitleaks — scan for secrets (BLOCKING)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No continue-on-error: secrets in code fail the build
