name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - "scripts/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    name: Lint · Build · Check no fake data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for gitleaks full history scan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check no fake data
        run: npm run check:no-fake-data

      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but don't fail until lockfile is clean

      - name: Gitleaks — scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # warn until baseline is established
